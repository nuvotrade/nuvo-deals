<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>NUVO Deal Engine</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'SF Pro Display','SF Pro Text',system-ui,-apple-system,BlinkMacSystemFont,sans-serif;background:radial-gradient(ellipse at top left,#1a2332 0%,#0a0f1a 40%,#000 100%);color:#e5e7eb;overflow-x:hidden;min-height:100vh}
input::placeholder{color:#374151!important}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield}
select option{background:#0f172a;color:#e5e7eb}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.container{max-width:520px;margin:0 auto;padding:16px 16px 40px}
.hdr{text-align:center;padding:20px 16px 16px;margin-bottom:16px;background:radial-gradient(ellipse at top,rgba(250,204,21,0.08) 0%,rgba(15,23,42,0.95) 60%);border-radius:20px;border:1px solid rgba(148,163,184,0.2);position:relative;overflow:hidden}
.hdr-glow{position:absolute;top:-60px;left:-60px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(250,204,21,0.12) 0%,transparent 70%);pointer-events:none}
.logo{font-size:28px;font-weight:800;letter-spacing:0.08em;background:linear-gradient(120deg,#fefce8 0%,#facc15 50%,#f97316 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:2px}
.hdr-sub{font-size:10px;letter-spacing:0.2em;color:#6b7280;text-transform:uppercase}
.timer-bar{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;background:rgba(15,23,42,0.8);border-radius:14px;border:1px solid rgba(148,163,184,0.15);margin-bottom:16px}
.timer-label{font-size:10px;color:#6b7280;letter-spacing:0.15em;text-transform:uppercase}
.timer-val{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:0.05em}
.step-row{display:flex;gap:6px;justify-content:center;margin-bottom:20px}
.step-pill{padding:6px 14px;border-radius:999px;font-size:11px;font-weight:600;transition:all 0.2s}
.step-pill.future{border:1px solid rgba(148,163,184,0.25);background:rgba(15,23,42,0.6);color:#4b5563}
.step-pill.active{border:1px solid rgba(250,204,21,0.6);background:rgba(250,204,21,0.1);color:#fef9c3}
.step-pill.done{border:1px solid #22c55e;background:rgba(34,197,94,0.15);color:#86efac}
.card{background:rgba(15,23,42,0.9);border:1px solid rgba(148,163,184,0.2);border-radius:18px;padding:20px 18px;margin-bottom:14px}
.card-title{font-size:11px;font-weight:700;color:#6b7280;letter-spacing:0.16em;text-transform:uppercase;margin-bottom:14px}
.input-wrap{margin-bottom:14px}
.form-label{display:block;font-size:11px;font-weight:600;color:#6b7280;letter-spacing:0.1em;text-transform:uppercase;margin-bottom:5px}
.hint{font-weight:400;font-size:10px;color:#4b5563;text-transform:none;letter-spacing:0}
.form-input{width:100%;padding:12px 14px;background:rgba(8,12,24,0.9);border:1px solid rgba(148,163,184,0.3);border-radius:12px;color:#f1f5f9;font-size:15px;font-weight:500;outline:none;transition:border-color 0.2s,box-shadow 0.2s}
.form-input:focus{border-color:#facc15;box-shadow:0 0 0 2px rgba(250,204,21,0.2)}
.form-input.mono{font-family:'SF Mono','Fira Code',monospace;letter-spacing:0.08em;text-transform:uppercase}
.form-input.price{padding-left:30px;font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.form-input.readonly{color:#6b7280;cursor:default}
.form-select{width:100%;padding:12px 14px;background:rgba(8,12,24,0.9);border:1px solid rgba(148,163,184,0.3);border-radius:12px;color:#f1f5f9;font-size:15px;font-weight:500;outline:none;appearance:none;cursor:pointer}
.form-select:focus{border-color:#facc15;box-shadow:0 0 0 2px rgba(250,204,21,0.2)}
.input-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.input-row-3{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px}
.v-card{background:linear-gradient(135deg,rgba(250,204,21,0.08) 0%,rgba(15,23,42,0.95) 100%);border:1px solid rgba(250,204,21,0.25);border-radius:16px;padding:16px 18px;margin-top:14px;margin-bottom:10px;animation:fadeUp 0.3s ease-out}
.v-title{font-size:20px;font-weight:800;color:#fefce8;letter-spacing:0.02em}
.v-sub{font-size:12px;color:#9ca3af;margin-top:2px;font-family:monospace}
.v-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.v-chip{padding:4px 10px;border-radius:999px;background:rgba(250,204,21,0.1);border:1px solid rgba(250,204,21,0.2);font-size:10px;font-weight:600;color:#fde68a;letter-spacing:0.06em;text-transform:uppercase}
.deal-btns{display:flex;gap:10px}
.deal-btn{flex:1;padding:22px 10px;border:none;border-radius:18px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;transition:transform 0.15s,box-shadow 0.15s;box-shadow:0 12px 30px rgba(0,0,0,0.45)}
.deal-btn:active{transform:scale(0.97)}
.deal-btn.sell{background:linear-gradient(135deg,#166534 0%,#22c55e 100%)}
.deal-btn.buy{background:linear-gradient(135deg,#1e3a8a 0%,#3b82f6 100%)}
.deal-btn.consign{background:linear-gradient(135deg,#581c87 0%,#a855f7 100%)}
.deal-btn-icon{font-size:28px}
.deal-btn-label{font-size:13px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase}
.deal-btn-sub{font-size:10px;opacity:0.7;font-weight:500}
.nav-row{display:flex;gap:10px;margin-top:20px}
.nav-btn{flex:1;padding:14px 16px;border-radius:14px;font-size:14px;font-weight:600;cursor:pointer;transition:all 0.15s;border:none;text-align:center}
.nav-btn.back{background:rgba(15,23,42,0.8);color:#9ca3af;border:1px solid rgba(148,163,184,0.3)}
.nav-btn.next{background:linear-gradient(120deg,#facc15 0%,#f97316 100%);color:#111}
.nav-btn.next:disabled{opacity:0.4;cursor:not-allowed}
.big-btn{width:100%;padding:18px 20px;border:none;border-radius:16px;font-size:16px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;transition:transform 0.15s;box-shadow:0 10px 30px rgba(0,0,0,0.4);letter-spacing:0.04em}
.big-btn:active{transform:scale(0.98)}
.big-btn.primary{background:linear-gradient(120deg,#facc15 0%,#f97316 100%);color:#111}
.big-btn.docusign{background:linear-gradient(120deg,#4f46e5 0%,#7c3aed 100%);color:#fff;margin-top:10px}
.big-btn.print-btn{background:rgba(15,23,42,0.8);color:#e5e7eb;border:1px solid rgba(148,163,184,0.3);margin-top:10px}
.big-btn.secondary{background:rgba(15,23,42,0.8);color:#9ca3af;border:1px solid rgba(148,163,184,0.2);margin-top:10px}
.big-btn:disabled{opacity:0.5;cursor:not-allowed;transform:none}
.summ-row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid rgba(31,41,55,0.6)}
.summ-row:last-child{border-bottom:none}
.summ-label{font-size:12px;color:#6b7280}
.summ-val{font-size:13px;font-weight:600;color:#f1f5f9}
.summ-total{display:flex;justify-content:space-between;padding:12px 0 4px;margin-top:4px}
.summ-total-label{font-size:14px;font-weight:700;color:#facc15;letter-spacing:0.06em;text-transform:uppercase}
.summ-total-val{font-size:20px;font-weight:800;color:#fefce8}
.doc-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid rgba(31,41,55,0.4);cursor:pointer;transition:background 0.15s}
.doc-row:last-child{border-bottom:none}
.doc-row:hover{background:rgba(250,204,21,0.04);border-radius:8px;padding-left:6px;margin-left:-6px}
.doc-check{width:20px;height:20px;border-radius:6px;background:rgba(34,197,94,0.2);border:1px solid #22c55e;display:flex;align-items:center;justify-content:center;font-size:12px;color:#22c55e;font-weight:700;flex-shrink:0}
.doc-name{font-size:13px;font-weight:500;color:#e5e7eb}
.doc-form{font-size:10px;color:#6b7280;margin-left:auto;flex-shrink:0}
.doc-preview-btn{font-size:10px;color:#facc15;font-weight:600;margin-left:8px;flex-shrink:0}
.county-badge{margin-bottom:14px;padding:6px 12px;border-radius:10px;background:rgba(250,204,21,0.08);border:1px solid rgba(250,204,21,0.15);font-size:11px;color:#fde68a}
.vin-loading{margin-top:8px;font-size:12px;color:#facc15;display:flex;align-items:center;gap:6px}
.vin-spinner{display:inline-block;width:12px;height:12px;border:2px solid #facc15;border-top-color:transparent;border-radius:50%;animation:spin 0.8s linear infinite}
.vin-error{margin-top:8px;font-size:12px;color:#ef4444}
.cobuyer-toggle{background:none;border:none;color:#facc15;font-size:12px;font-weight:600;cursor:pointer;padding:0;letter-spacing:0.06em}
.price-symbol{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:18px;font-weight:700;color:#facc15}
.divider{height:1px;background:rgba(148,163,184,0.15);margin:8px 0}
.info-note{padding:8px 12px;border-radius:10px;font-size:11px}
.info-note.blue{background:rgba(59,130,246,0.1);border:1px solid rgba(59,130,246,0.2);color:#93c5fd}
.info-note.green{background:rgba(34,197,94,0.1);border:1px solid rgba(34,197,94,0.2);color:#86efac}
.info-note.red{background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.2);color:#fca5a5}
.footer-text{text-align:center;margin-top:16px;font-size:10px;color:#374151}
.header-mini{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.header-mini-logo{font-size:18px;font-weight:800;background:linear-gradient(120deg,#fefce8,#facc15);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.deal-type-pill{padding:3px 10px;border-radius:999px;font-size:10px;font-weight:700;letter-spacing:0.14em}
.close-btn{background:rgba(15,23,42,0.8);border:1px solid rgba(148,163,184,0.25);border-radius:999px;color:#6b7280;font-size:18px;width:32px;height:32px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1}
.close-btn:hover{color:#e5e7eb;border-color:#e5e7eb}
.completion-banner{text-align:center;padding:20px 16px;margin-bottom:16px;border-radius:18px}
.completion-banner.fast{background:linear-gradient(135deg,rgba(34,197,94,0.15) 0%,rgba(15,23,42,0.95) 100%);border:1px solid rgba(34,197,94,0.3)}
.completion-banner.normal{background:linear-gradient(135deg,rgba(250,204,21,0.1) 0%,rgba(15,23,42,0.95) 100%);border:1px solid rgba(250,204,21,0.3)}
.recap-card{background:linear-gradient(135deg,rgba(250,204,21,0.06) 0%,rgba(15,23,42,0.95) 100%)!important;border:1px solid rgba(250,204,21,0.2)!important}
.dmv-section{margin-top:10px;padding-top:10px;border-top:1px solid rgba(148,163,184,0.15)}
.dmv-label{font-size:10px;font-weight:600;color:#4b5563;letter-spacing:0.12em;margin-bottom:6px;text-transform:uppercase}
.hidden{display:none!important}
.status-bar{padding:12px 16px;border-radius:12px;margin-bottom:12px;display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600}
.status-bar.sending{background:rgba(79,70,229,0.15);border:1px solid rgba(79,70,229,0.3);color:#a5b4fc}
.status-bar.success{background:rgba(34,197,94,0.15);border:1px solid rgba(34,197,94,0.3);color:#86efac}
.status-bar.error{background:rgba(239,68,68,0.15);border:1px solid rgba(239,68,68,0.3);color:#fca5a5}
</style>
</head>
<body>

<div class="container">
  <!-- HOME -->
  <div id="screen-home">
    <div class="hdr"><div class="hdr-glow"></div><div style="position:relative;z-index:1">
      <div class="logo">NUVO</div><div class="hdr-sub">Deal Engine · Dealer #00104</div>
      <div style="margin-top:12px;font-size:11px;color:#4b5563">Close a deal in under <span style="color:#facc15;font-weight:700">3 minutes</span></div>
    </div></div>
    <div class="card" style="padding:14px 14px 18px"><div class="card-title">Start a Deal</div>
      <div class="deal-btns">
        <button class="deal-btn sell" onclick="startDeal('sell')"><div class="deal-btn-icon">🏷️</div><div class="deal-btn-label" style="color:#f0fdf4">Sell</div><div class="deal-btn-sub" style="color:#bbf7d0">Retail / Wholesale</div></button>
        <button class="deal-btn buy" onclick="startDeal('buy')"><div class="deal-btn-icon">🔑</div><div class="deal-btn-label" style="color:#eff6ff">Buy</div><div class="deal-btn-sub" style="color:#bfdbfe">Acquisition</div></button>
        <button class="deal-btn consign" onclick="startDeal('consign')"><div class="deal-btn-icon">🤝</div><div class="deal-btn-label" style="color:#faf5ff">Consign</div><div class="deal-btn-sub" style="color:#e9d5ff">Net to Seller</div></button>
      </div>
    </div>
    <div class="footer-text">NuVo Trade Co. Inc. · 1560 Superior Ave Ste B3, Costa Mesa, CA 92627</div>
  </div>

  <!-- DEAL SCREEN -->
  <div id="screen-deal" class="hidden">
    <div class="header-mini">
      <div style="display:flex;align-items:center;gap:10px"><div class="header-mini-logo">NUVO</div><div id="deal-type-badge" class="deal-type-pill"></div></div>
      <button class="close-btn" onclick="resetDeal()">✕</button>
    </div>
    <div class="timer-bar">
      <div><div class="timer-label">Deal Timer</div><div id="timer-display" class="timer-val" style="color:#22c55e">0:00</div></div>
      <div style="text-align:right"><div class="timer-label">Target</div><div style="font-size:14px;font-weight:600;color:#374151">3:00</div></div>
    </div>
    <div id="step-pills" class="step-row"></div>

    <!-- STEP 1 -->
    <div id="step-1" class="hidden">
      <div class="card"><div class="card-title">Vehicle Identification</div>
        <div class="input-wrap"><label class="form-label">VIN <span class="hint">17 characters</span></label>
          <input id="vin-input" class="form-input mono" maxlength="17" placeholder="e.g. WP0AB2A99JS123065" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false">
          <div id="vin-status"></div></div>
        <div id="vehicle-card"></div>
        <div class="input-wrap"><label class="form-label">Odometer (Miles)</label>
          <input id="miles-input" class="form-input" type="number" placeholder="e.g. 23919" inputmode="numeric"></div>
      </div>
      <div class="nav-row"><button class="nav-btn back" onclick="resetDeal()">Cancel</button><button id="nav-1-next" class="nav-btn next" disabled onclick="goStep(2)">Next → Buyer</button></div>
    </div>

    <!-- STEP 2 -->
    <div id="step-2" class="hidden">
      <div class="card"><div id="step2-title" class="card-title">Buyer Information</div>
        <div class="input-wrap"><label id="party-label" class="form-label">Buyer Full Name</label><input id="buyer-name" class="form-input" placeholder="FIRST MIDDLE LAST" autocomplete="off" autocapitalize="characters"></div>
        <div id="cobuyer-section"><button class="cobuyer-toggle" onclick="toggleCobuyer()">+ Add Co-Buyer</button><div id="cobuyer-field" class="hidden" style="margin-top:8px"><input id="buyer-cobuyer" class="form-input" placeholder="CO-BUYER FULL NAME" autocomplete="off" autocapitalize="characters"></div></div>
        <div style="margin-bottom:14px"></div>
        <div class="input-wrap"><label class="form-label">Street Address</label><input id="buyer-address" class="form-input" placeholder="12345 ELM ST" autocomplete="off" autocapitalize="characters"></div>
        <div class="input-row-3">
          <div class="input-wrap"><label class="form-label">City</label><input id="buyer-city" class="form-input" placeholder="COSTA MESA" autocomplete="off" autocapitalize="characters"></div>
          <div class="input-wrap"><label class="form-label">State</label><input id="buyer-state" class="form-input" value="CA" maxlength="2" autocomplete="off" autocapitalize="characters"></div>
          <div class="input-wrap"><label class="form-label">Zip</label><input id="buyer-zip" class="form-input" maxlength="5" placeholder="92627" inputmode="numeric" autocomplete="off"></div>
        </div>
        <div id="county-badge" class="county-badge hidden"></div>
        <div class="input-row">
          <div class="input-wrap"><label class="form-label">Phone</label><input id="buyer-phone" class="form-input" placeholder="(949) 888-8888" type="tel" autocomplete="off"></div>
          <div class="input-wrap"><label class="form-label">Email</label><input id="buyer-email" class="form-input" placeholder="buyer@email.com" type="email" autocomplete="off"></div>
        </div>
        <div class="input-wrap"><label class="form-label">Driver License # <span class="hint">optional</span></label><input id="buyer-dl" class="form-input" placeholder="D1234567" autocomplete="off" autocapitalize="characters"></div>
      </div>
      <div class="nav-row"><button class="nav-btn back" onclick="goStep(1)">← Back</button><button id="nav-2-next" class="nav-btn next" disabled onclick="goStep(3)">Next → Numbers</button></div>
    </div>

    <!-- STEP 3 -->
    <div id="step-3" class="hidden">
      <div id="vehicle-mini" class="card hidden" style="padding:12px 16px"></div>
      <div class="card"><div class="card-title">Deal Numbers</div>
        <div class="input-wrap"><label class="form-label">Selling Price</label><div style="position:relative"><span class="price-symbol">$</span><input id="sale-price" class="form-input price" type="number" placeholder="0.00" inputmode="decimal"></div></div>
        <div class="input-row">
          <div class="input-wrap"><label class="form-label">Tax County</label><select id="tax-county" class="form-select"></select></div>
          <div class="input-wrap"><label class="form-label">Doc Fee</label><input class="form-input readonly" value="$95.00" readonly></div>
        </div>
      </div>
      <div id="fee-breakdown" class="card hidden"></div>
      <div class="nav-row"><button class="nav-btn back" onclick="goStep(2)">← Back</button><button id="nav-3-next" class="nav-btn next" disabled onclick="completeDeal()">Generate Packet →</button></div>
    </div>

    <!-- STEP 4 -->
    <div id="step-4" class="hidden">
      <div id="completion-banner" class="completion-banner fast"></div>
      <div id="deal-recap" class="card recap-card"></div>
      <div id="doc-packet" class="card"></div>
      <div id="docusign-status"></div>
      <button class="big-btn primary" onclick="previewPacket()">📄 Preview Full Packet</button>
      <button class="big-btn docusign" id="btn-docusign" onclick="sendDocuSign()">✍️ Send via DocuSign</button>
      <button class="big-btn print-btn" onclick="printPacket()">🖨️ Print Packet</button>
      <button class="big-btn secondary" onclick="resetDeal()">Start New Deal</button>
      <div class="footer-text" style="margin-top:16px">* DMV fees are estimated · NuVo Trade Co. Inc. · Dealer #00104</div>
    </div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════
// NUVO DEAL ENGINE v2.0
// NuVo Trade Co. Inc. | Dealer #00104
// Full packet generation + DocuSign integration
// ═══════════════════════════════════════════════════

const DEALER={name:"NuVo Trade Co. Inc.",address:"1560 Superior Ave Ste B3",city:"Costa Mesa",state:"CA",zip:"92627",phone:"(949) 887-1323",fax:"(949) 610-7808",email:"support@nuvotrade.com",dealer_no:"00104",seller_permit:"249963776",doc_fee:95,smog_fee:50};
const DOCUSIGN_WORKER="https://nuvo-docusign.yulgutierrez.workers.dev";
const CA_TAX={"Los Angeles":0.095,"Orange":0.0775,"San Diego":0.0775,"San Bernardino":0.0775,"Riverside":0.0775,"Ventura":0.0725,"Sacramento":0.0875,"San Francisco":0.08625,"Santa Clara":0.09125,"Alameda":0.1025,"Kern":0.0825,"Fresno":0.08475,"San Joaquin":0.09,"Contra Costa":0.0925,"Imperial":0.0875,"Other":0.0775};
const ZIP_MAP={"900":"Los Angeles","901":"Los Angeles","902":"Los Angeles","903":"Los Angeles","904":"Los Angeles","905":"Los Angeles","906":"Los Angeles","907":"Los Angeles","908":"Los Angeles","910":"Los Angeles","911":"Los Angeles","912":"Los Angeles","913":"Los Angeles","914":"Los Angeles","915":"Los Angeles","916":"Los Angeles","917":"Los Angeles","918":"Los Angeles","920":"San Diego","921":"San Diego","922":"San Bernardino","923":"San Bernardino","924":"San Bernardino","925":"San Bernardino","926":"Orange","927":"Orange","928":"Orange","930":"Ventura","931":"Ventura","935":"San Joaquin","936":"Fresno","940":"San Francisco","941":"San Francisco","942":"Sacramento","943":"Sacramento","944":"San Francisco","945":"Alameda","946":"Alameda","947":"Alameda","950":"Santa Clara","951":"Riverside"};

let D={step:0,type:null,start:null,elapsed:0,done:false,vehicle:null,showCobuyer:false,county:"Orange",dealCalc:null};
let timer=null;
const $=id=>document.getElementById(id);
const fmt=n=>"$"+Number(n||0).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const show=(el,v)=>{if(typeof el==='string')el=$(el);el.classList.toggle('hidden',!v)};
const today=()=>{const d=new Date();return String(d.getMonth()+1).padStart(2,'0')+'/'+String(d.getDate()).padStart(2,'0')+'/'+d.getFullYear()};

// ═══ CALC ═══
function calcDMV(p){const vlf=Math.round(p*0.0065*100)/100;let tif=p<=4999?0:p<=24999?25:p<=34999?50:p<=59999?100:175;return{vlf,baseReg:65,titleTransfer:15,smogAbatement:20,chpFee:30,tif,total:Math.round((vlf+65+15+20+30+tif)*100)/100}}
function calcDeal(price,county){const p=parseFloat(price)||0,rate=CA_TAX[county]||0.0775,tax=Math.round(p*rate*100)/100,dmv=calcDMV(p),sub=Math.round((p+DEALER.doc_fee+DEALER.smog_fee+tax)*100)/100;return{salePrice:p,docFee:DEALER.doc_fee,smogFee:DEALER.smog_fee,salesTax:tax,taxRate:rate,dmvFees:dmv,subtotal:sub,totalDue:Math.round((sub+dmv.total)*100)/100}}

function getDocList(type,price){
  const d=[];
  if(type==="sell"){d.push({n:"eSign Consent",f:"E-SIGN Act"},{n:"Deal Summary / Buyer's Order",f:"DealSummary"},{n:"Retail Installment Contract",f:"LAW 553-CA-ARB"},{n:"REG 262 Transfer & Bill of Sale",f:"REG 262"},{n:"FTC Buyers Guide (As-Is)",f:"Buyers Guide"},{n:"Due Bill",f:"DC-DB01"},{n:"Agreement to Furnish Insurance",f:"DC-ATF01"});if(price<40000)d.push({n:"Contract Cancellation Option",f:"CCOA"});d.push({n:"Privacy Notice",f:"PVN001"},{n:"REG 51 Report of Sale",f:"REG 51"})}
  else if(type==="buy"){d.push({n:"Purchase Agreement",f:"Custom"},{n:"REG 262 Transfer & Bill of Sale",f:"REG 262"},{n:"Odometer Disclosure",f:"REG 262 §3"},{n:"Power of Attorney",f:"REG 262 §5"})}
  else{d.push({n:"Consignment Agreement",f:"Custom"},{n:"eSign Consent",f:"E-SIGN Act"},{n:"Privacy Notice",f:"PVN001"})}
  return d;
}

    html+=`<div class="doc-divider">Document ${i+1} of ${docs.length}: ${doc.name}</div>
<div class="doc-page"><style>${styleMatch?styleMatch[1]:''}</style>${bodyMatch?bodyMatch[1]:doc.html}
<div class="page-num">Page ${i+1} of ${docs.length} · ${DEALER.name} · Dealer #${DEALER.dealer_no}</div></div>`;
  });
  html+=`</body></html>`;
  w.document.write(html);
  w.document.close();
}

// ═══ PRINT ═══
function printPacket(){
  const data=getDealData();
  const docs=getAllDocuments(data);
  const w=window.open('','_blank');
  if(!w){alert('Please allow popups for this site');return;}
  let html=`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Print - Deal Packet</title>
<style>@media print{@page{margin:0.5in}body{font-size:11px}}body{font-family:Arial,sans-serif;margin:0;padding:0}
.page{page-break-after:always;padding:20px;max-width:800px;margin:0 auto}</style></head><body>`;
  docs.forEach(doc=>{
    const bodyMatch=doc.html.match(/<body[^>]*>([\s\S]*)<\/body>/i);
    const styleMatch=doc.html.match(/<style[^>]*>([\s\S]*?)<\/style>/i);
    html+=`<div class="page"><style>${styleMatch?styleMatch[1]:''}</style>${bodyMatch?bodyMatch[1]:doc.html}</div>`;
  });
  html+=`</body></html>`;
  w.document.write(html);
  w.document.close();
  setTimeout(()=>w.print(),500);
}

// ═══ DOCUSIGN ═══
async function sendDocuSign(){
  const btn=$('btn-docusign');
  const statusEl=$('docusign-status');
  const data=getDealData();
  const docs=getAllDocuments(data);

  if(!data.buyer.email){statusEl.innerHTML='<div class="status-bar error">Buyer email is required for DocuSign</div>';return;}

  btn.disabled=true;
  btn.innerHTML='<span class="vin-spinner" style="border-color:#fff;border-top-color:transparent"></span> Sending to DocuSign...';
  statusEl.innerHTML='<div class="status-bar sending"><span class="vin-spinner"></span> Creating envelope and sending to '+data.buyer.email+'...</div>';

  try{
    const docPayload=docs.map(doc=>({
      base64:btoa(unescape(encodeURIComponent(doc.html))),
      name:doc.name,
      extension:'html'
    }));

    const res=await fetch(DOCUSIGN_WORKER+'/send',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        signerName:data.buyer.name,
        signerEmail:data.buyer.email,
        coSignerName:data.buyer.cobuyer||null,
        coSignerEmail:null,
        documents:docPayload,
        emailSubject:`${DEALER.name} — ${data.vehicle.year} ${data.vehicle.make} ${data.vehicle.model} Purchase Documents`
      })
    });

    const result=await res.json();
    if(result.success){
      statusEl.innerHTML=`<div class="status-bar success">✅ Envelope sent! ID: ${result.envelopeId}<br><span style="font-size:11px;font-weight:400">Sent to ${data.buyer.name} (${data.buyer.email})</span></div>`;
      btn.innerHTML='✅ Sent via DocuSign';
    } else {
      throw new Error(result.error||'Unknown error');
    }
  } catch(err){
    statusEl.innerHTML=`<div class="status-bar error">❌ DocuSign error: ${err.message}</div>`;
    btn.disabled=false;
    btn.innerHTML='✍️ Retry DocuSign';
  }
}

// ═══ TIMER ═══
function updateTimer(){if(!D.start||D.done)return;D.elapsed=Math.floor((Date.now()-D.start)/1000);const m=Math.floor(D.elapsed/60),s=D.elapsed%60;const el=$('timer-display');if(el){el.textContent=m+":"+String(s).padStart(2,'0');el.style.color=D.elapsed<120?"#22c55e":D.elapsed<180?"#facc15":"#ef4444"}}

// ═══ NAV ═══
function startDeal(type){
  D.type=type;D.start=Date.now();D.elapsed=0;D.done=false;D.vehicle=null;D.showCobuyer=false;D.county="Orange";D.dealCalc=null;
  show('screen-home',false);show('screen-deal',true);
  const colors={sell:"#22c55e",buy:"#3b82f6",consign:"#a855f7"},labels={sell:"SELLING",buy:"BUYING",consign:"CONSIGNMENT"};
  const badge=$('deal-type-badge');badge.textContent=labels[type];badge.style.background=colors[type]+"22";badge.style.border="1px solid "+colors[type]+"55";badge.style.color=colors[type];
  $('vin-input').value='';$('miles-input').value='';$('vehicle-card').innerHTML='';$('vin-status').innerHTML='';
  $('buyer-name').value='';$('buyer-cobuyer').value='';$('buyer-address').value='';$('buyer-city').value='';$('buyer-state').value='CA';$('buyer-zip').value='';$('buyer-phone').value='';$('buyer-email').value='';$('buyer-dl').value='';$('sale-price').value='';
  show('cobuyer-field',false);show('county-badge',false);show('fee-breakdown',false);
  const pw=type==='sell'?'Buyer':type==='buy'?'Seller':'Owner';
  $('step2-title').textContent=pw+' Information';$('party-label').textContent=pw+' Full Name';$('nav-1-next').textContent='Next → '+pw;show('cobuyer-section',type==='sell');
  const sel=$('tax-county');sel.innerHTML=Object.keys(CA_TAX).map(c=>`<option value="${c}">${c} (${(CA_TAX[c]*100).toFixed(2)}%)</option>`).join('');sel.value="Orange";
  if(timer)clearInterval(timer);timer=setInterval(updateTimer,1000);updateTimer();
  goStep(1);
}

function goStep(n){
  D.step=n;[1,2,3,4].forEach(i=>show('step-'+i,i===n));
  const names=D.type==='sell'?['Vehicle','Buyer','Numbers','Packet']:D.type==='buy'?['Vehicle','Seller','Numbers','Packet']:['Vehicle','Owner','Terms','Packet'];
  show('step-pills',n<4);$('step-pills').innerHTML=names.map((l,i)=>`<div class="step-pill ${n>i+1?'done':n===i+1?'active':'future'}">${n>i+1?'✓ ':''}${l}</div>`).join('');
  if(n===3)setupStep3();checkNav();
}

function resetDeal(){if(timer)clearInterval(timer);D={step:0,type:null,start:null,elapsed:0,done:false,vehicle:null,showCobuyer:false,county:"Orange",dealCalc:null};show('screen-home',true);show('screen-deal',false)}

function checkNav(){
  if(D.step===1)$('nav-1-next').disabled=!(D.vehicle&&$('miles-input').value);
  else if(D.step===2){const h=v=>v&&v.trim().length>0;$('nav-2-next').disabled=!(h($('buyer-name').value)&&h($('buyer-address').value)&&h($('buyer-city').value)&&h($('buyer-zip').value)&&h($('buyer-phone').value)&&h($('buyer-email').value))}
  else if(D.step===3)$('nav-3-next').disabled=!(parseFloat($('sale-price').value)>0);
}

// ═══ VIN ═══
let vinTimeout=null;
async function decodeVin(vin){
  if(vin.length!==17){$('vin-status').innerHTML='<div class="vin-error">VIN must be 17 characters</div>';return}
  $('vin-status').innerHTML='<div class="vin-loading"><span class="vin-spinner"></span>Decoding VIN...</div>';D.vehicle=null;$('vehicle-card').innerHTML='';checkNav();
  try{const r=await fetch(`https://vpic.nhtsa.dot.gov/api/vehicles/decodevin/${vin}?format=json`);const data=await r.json();const get=name=>{const i=data.Results?.find(x=>x.Variable===name);return i?.Value&&i.Value!=="Not Applicable"&&i.Value!==""?i.Value:null};
  const year=get("Model Year"),make=get("Make"),model=get("Model");if(!year||!make){$('vin-status').innerHTML='<div class="vin-error">Could not decode VIN</div>';return}
  D.vehicle={vin:vin.toUpperCase(),year,make:make.toUpperCase(),model:(model||"").toUpperCase(),body:get("Body Class")||"",engine:get("Displacement (L)")?get("Displacement (L)")+"L":"",cylinders:get("Engine Number of Cylinders")||"",drive:get("Drive Type")||"",fuel:get("Fuel Type - Primary")||"",trim:get("Trim")||""};
  $('vin-status').innerHTML='';const v=D.vehicle;const chips=[v.body,v.engine&&`${v.engine} ${v.cylinders?v.cylinders+'cyl':''}`,v.drive,v.fuel,v.trim].filter(Boolean).map(c=>`<span class="v-chip">${c}</span>`).join('');
  $('vehicle-card').innerHTML=`<div class="v-card"><div class="v-title">${v.year} ${v.make} ${v.model}</div><div class="v-sub">${v.vin}</div><div class="v-chips">${chips}</div></div>`;checkNav()}
  catch(e){$('vin-status').innerHTML='<div class="vin-error">Network error</div>'}
}

// ═══ STEP 3 ═══
function setupStep3(){const v=D.vehicle;if(v){const mi=$('miles-input').value;$('vehicle-mini').innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center"><div><div style="font-size:15px;font-weight:700;color:#fefce8">${v.year} ${v.make} ${v.model}</div><div style="font-size:11px;color:#6b7280">${v.vin} · ${parseInt(mi||0).toLocaleString()} mi</div></div><div style="font-size:11px;color:#6b7280">→ ${($('buyer-name').value||'').split(' ')[0]}</div></div>`;show('vehicle-mini',true)}updateFees()}

function updateFees(){
  const price=parseFloat($('sale-price').value);if(!price||price<=0){show('fee-breakdown',false);return}
  const county=$('tax-county').value;const dc=calcDeal(price,county);D.dealCalc=dc;show('fee-breakdown',true);
  $('fee-breakdown').innerHTML=`<div class="card-title">Fee Breakdown</div>
<div class="summ-row"><span class="summ-label">Sale Price</span><span class="summ-val">${fmt(dc.salePrice)}</span></div>
<div class="summ-row"><span class="summ-label">Doc Fee</span><span class="summ-val">${fmt(dc.docFee)}</span></div>
<div class="summ-row"><span class="summ-label">Smog Certification</span><span class="summ-val">${fmt(dc.smogFee)}</span></div>
<div class="summ-row"><span class="summ-label">Sales Tax (${(dc.taxRate*100).toFixed(2)}%)</span><span class="summ-val">${fmt(dc.salesTax)}</span></div>
<div class="summ-row" style="border-bottom:none"><span class="summ-label">Subtotal</span><span class="summ-val" style="color:#facc15">${fmt(dc.subtotal)}</span></div>
<div class="dmv-section"><div class="dmv-label">DMV Fees (Estimated)</div>
<div class="summ-row"><span class="summ-label">Vehicle License Fee</span><span class="summ-val">${fmt(dc.dmvFees.vlf)}</span></div>
<div class="summ-row"><span class="summ-label">Base Registration</span><span class="summ-val">${fmt(dc.dmvFees.baseReg)}</span></div>
<div class="summ-row"><span class="summ-label">Title Transfer</span><span class="summ-val">${fmt(dc.dmvFees.titleTransfer)}</span></div>
<div class="summ-row"><span class="summ-label">Trans. Improvement Fee</span><span class="summ-val">${fmt(dc.dmvFees.tif)}</span></div>
<div class="summ-row"><span class="summ-label">Smog Abatement</span><span class="summ-val">${fmt(dc.dmvFees.smogAbatement)}</span></div>
<div class="summ-row" style="border-bottom:none"><span class="summ-label">CHP Fee</span><span class="summ-val">${fmt(dc.dmvFees.chpFee)}</span></div></div>
<div class="summ-total"><span class="summ-total-label">Total Due</span><span class="summ-total-val">${fmt(dc.totalDue)}</span></div>`;checkNav();
}

// ═══ COMPLETE ═══
function completeDeal(){
  D.done=true;if(timer)clearInterval(timer);
  const price=parseFloat($('sale-price').value),county=$('tax-county').value;
  D.dealCalc=calcDeal(price,county);const dc=D.dealCalc,v=D.vehicle,fast=D.elapsed<=180;
  const m=Math.floor(D.elapsed/60),s=D.elapsed%60,timeStr=m+":"+String(s).padStart(2,'0'),tc=D.elapsed<120?"#22c55e":D.elapsed<180?"#facc15":"#ef4444";
  $('completion-banner').className='completion-banner '+(fast?'fast':'normal');
  $('completion-banner').innerHTML=`<div style="font-size:36px;margin-bottom:4px">${fast?'⚡':'✅'}</div><div style="font-size:18px;font-weight:800;color:${fast?'#86efac':'#fde68a'}">${fast?'DEAL CLOSED UNDER 3 MIN':'DEAL COMPLETE'}</div><div style="font-size:28px;font-weight:800;color:${tc};margin-top:4px">${timeStr}</div>`;
  const bn=$('buyer-name').value,mi=$('miles-input').value,pl=D.type==='sell'?'Buyer':D.type==='buy'?'Seller':'Owner',cb=$('buyer-cobuyer').value;
  $('deal-recap').innerHTML=`<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px"><div><div style="font-size:18px;font-weight:800;color:#fefce8">${v.year} ${v.make} ${v.model}</div><div style="font-size:11px;color:#6b7280;font-family:monospace">${v.vin}</div></div><div style="text-align:right"><div style="font-size:20px;font-weight:800;color:#facc15">${fmt(dc.totalDue)}</div><div style="font-size:10px;color:#6b7280">TOTAL DUE</div></div></div><div class="divider"></div>
<div class="summ-row"><span class="summ-label">${pl}</span><span class="summ-val">${bn}</span></div>${cb?`<div class="summ-row"><span class="summ-label">Co-Buyer</span><span class="summ-val">${cb}</span></div>`:''}
<div class="summ-row"><span class="summ-label">Address</span><span class="summ-val">${$('buyer-address').value}, ${$('buyer-city').value}</span></div>
<div class="summ-row"><span class="summ-label">Miles</span><span class="summ-val">${parseInt(mi||0).toLocaleString()}</span></div>
<div class="summ-row"><span class="summ-label">Sale Price</span><span class="summ-val">${fmt(dc.salePrice)}</span></div>
<div class="summ-row"><span class="summ-label">Tax (${(dc.taxRate*100).toFixed(2)}%)</span><span class="summ-val">${fmt(dc.salesTax)}</span></div>
<div class="summ-row"><span class="summ-label">Doc + Smog</span><span class="summ-val">${fmt(dc.docFee+dc.smogFee)}</span></div>
<div class="summ-row" style="border-bottom:none"><span class="summ-label">DMV Fees*</span><span class="summ-val">${fmt(dc.dmvFees.total)}</span></div>`;
  const docs=getDocList(D.type,dc.salePrice);
  $('doc-packet').innerHTML=`<div class="card-title">Document Packet · ${docs.length} Forms</div>${docs.map(d=>`<div class="doc-row"><div class="doc-check">✓</div><span class="doc-name">${d.n}</span><span class="doc-form">${d.f}</span></div>`).join('')}${dc.salePrice>=40000&&D.type==='sell'?'<div class="info-note blue" style="margin-top:10px">CCOA not required — sale price exceeds $40,000</div>':''}`;
  $('docusign-status').innerHTML='';
  $('btn-docusign').disabled=false;$('btn-docusign').innerHTML='✍️ Send via DocuSign';
  goStep(4);
}

function toggleCobuyer(){D.showCobuyer=!D.showCobuyer;show('cobuyer-field',D.showCobuyer);document.querySelector('.cobuyer-toggle').textContent=D.showCobuyer?'− Remove Co-Buyer':'+ Add Co-Buyer'}

// ═══ EVENT LISTENERS ═══
document.addEventListener('DOMContentLoaded',()=>{
  $('vin-input').addEventListener('input',e=>{let v=e.target.value.replace(/[^a-zA-Z0-9]/g,'').toUpperCase();if(v!==e.target.value){const p=e.target.selectionStart;e.target.value=v;e.target.setSelectionRange(p,p)}if(vinTimeout)clearTimeout(vinTimeout);if(v.length===17)vinTimeout=setTimeout(()=>decodeVin(v),100);else{D.vehicle=null;$('vehicle-card').innerHTML='';$('vin-status').innerHTML='';checkNav()}});
  $('miles-input').addEventListener('input',()=>checkNav());
  ['buyer-name','buyer-address','buyer-city','buyer-state','buyer-zip','buyer-phone','buyer-email','buyer-dl'].forEach(id=>{
    $(id).addEventListener('input',e=>{if(!['buyer-phone','buyer-email'].includes(id)&&e.target.type!=='email'){const p=e.target.selectionStart;e.target.value=e.target.value.toUpperCase();e.target.setSelectionRange(p,p)}
    if(id==='buyer-zip'){const z=e.target.value;if(z.length>=3){const county=ZIP_MAP[z.substring(0,3)];if(county){D.county=county;$('tax-county').value=county;$('county-badge').innerHTML=`County detected: <strong>${county}</strong> · Tax rate: ${((CA_TAX[county]||0.0775)*100).toFixed(2)}%`;show('county-badge',true)}else show('county-badge',false)}else show('county-badge',false)}checkNav()})});
  $('sale-price').addEventListener('input',()=>{updateFees();checkNav()});
  $('tax-county').addEventListener('change',()=>{D.county=$('tax-county').value;updateFees()});
});
</script>
